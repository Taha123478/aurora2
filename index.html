:root{--sun:#FFD27A;--amber:#FFB65C;--orange:#FF8A3D;--rose:#F2557A;--ink:#2B1208;--cream:#FFF1E2;--warm:#FFC98F;
--pill:rgba(26,18,24,.86);--inbg:rgba(26,18,24,.86);--stamp:#3A1608;--ease:cubic-bezier(.2,.8,.2,1);
--font:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#120C10;color:#fff;font:15px var(--font)}
button,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s var(--ease)}
button:active{transform:scale(.95)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,p{margin:0}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);
background:var(--wall,linear-gradient(180deg,#FFB65C 0%,#FF8A3D 48%,#F2557A 100%))}
.scr.sun{--wall:radial-gradient(110% 55% at 95% 8%,#FF4F7B 0%,rgba(255,79,123,0) 62%),radial-gradient(90% 45% at 0% 38%,#FFD27A 0%,rgba(255,210,122,0) 62%),radial-gradient(100% 55% at 85% 92%,#FF5A36 0%,rgba(255,90,54,0) 66%),linear-gradient(180deg,#FFB65C 0%,#FF8A3D 48%,#F2557A 100%)}
.scr::before,.scr::after{content:"";position:absolute;border-radius:50%;pointer-events:none;animation:drift 9s ease-in-out infinite alternate}
.scr::before{left:-60px;top:30%;width:240px;height:240px;background:#FFE3A8;opacity:.5;filter:blur(46px)}
.scr::after{right:-70px;top:58%;width:260px;height:260px;background:#FF3D6E;opacity:.4;filter:blur(52px);animation-delay:-4s}
.scr.night{background:#120C10;--pill:#241A21;--inbg:#2A2027;--stamp:#BFA89C}
.scr.night::before{background:#FF8A3D;opacity:.25;filter:blur(80px);left:auto;right:-90px;top:-40px}
.scr.night::after{background:#F2557A;opacity:.22;filter:blur(90px);left:-100px;right:auto;top:55%}
@keyframes drift{to{transform:translate(26px,-30px)}}
.scr>*{position:relative;z-index:1}
.fade{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:scale(.985)}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.stag>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 80ms)}
.hidden{display:none!important}

/* splash + join */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.logo{width:92px;height:92px;border-radius:30px;background:var(--pill);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--sun);box-shadow:0 14px 34px rgba(90,20,10,.32)}
.big{font-size:38px;font-weight:800;letter-spacing:-.8px;color:var(--ink)}
.sub{color:#3A1608;font-weight:600;opacity:.85}
.card{width:100%;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:28px;background:rgba(26,18,24,.88);text-align:left}
.card label{font-size:12px;font-weight:700;color:var(--warm)}
.in{height:50px;border:0;border-radius:25px;padding:0 18px;background:rgba(0,0,0,.4);color:#fff;font-size:16px;width:100%}
.in::placeholder{color:#D9C3B8}
.in:focus{outline:2px solid var(--amber)}
.cta{height:52px;border:0;border-radius:26px;background:linear-gradient(135deg,var(--sun),#FF6A3D);color:var(--ink);font-size:16px;font-weight:800}
.err{color:#FFB3C1;font-size:13px;font-weight:600;min-height:18px}

/* chat */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.who{flex:1;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 6px;border:0;border-radius:26px;background:var(--pill);color:#fff;text-align:left;min-width:0;box-shadow:0 10px 28px rgba(90,20,10,.28)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--sun),#FF6A3D);color:var(--ink);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:12px;color:var(--warm);font-weight:600;min-height:15px}
.rb{width:52px;height:52px;border-radius:26px;border:0;background:var(--pill);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none;box-shadow:0 10px 28px rgba(90,20,10,.28)}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:14px 16px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msgs .sp{margin-top:auto}
.day{align-self:center;font-size:12px;font-weight:700;color:#fff;background:rgba(26,18,24,.55);padding:5px 12px;border-radius:14px;flex:none}
.m{display:flex;align-items:flex-end;gap:6px;max-width:84%;flex:none}
.m.in{align-self:flex-start}
.m.out{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:11px 16px;font-size:15px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.m.in .bub{border-radius:22px 22px 22px 8px;background:var(--inbg);color:#fff}
.m.out .bub{border-radius:22px 22px 8px 22px;background:var(--outbg,var(--cream));color:var(--ink);font-weight:500;box-shadow:0 6px 16px rgba(120,30,10,.18)}
.t{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--stamp);padding-bottom:4px;flex:none}
.tick{font-size:12px;letter-spacing:-3px;margin-right:3px}
.tick.r{color:#1E7BFF}
.pop{animation:msgpop .3s var(--ease)}
@keyframes msgpop{from{transform:translateY(10px) scale(.96);opacity:0}}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:22px 22px 22px 8px;background:var(--inbg);flex:none}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--warm);animation:dot 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.composer{padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:center;gap:6px;height:60px;padding:0 7px 0 8px;border-radius:30px;background:rgba(26,18,24,.92);box-shadow:0 14px 34px rgba(90,20,10,.32)}
.field{flex:1;min-width:0;display:flex;align-items:center;height:44px;border-radius:22px;background:rgba(0,0,0,.38)}
.field:focus-within{box-shadow:0 0 0 2px var(--amber)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-size:16px;height:100%;padding:0 14px 0 0}
.field input:focus-visible{outline:none}
.ib{width:44px;height:44px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none;font-size:22px}
.send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--sun),#FF6A3D);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin:0 16px 10px;padding:8px;border-radius:22px;background:rgba(26,18,24,.92);animation:rise .25s var(--ease)}
.emojis button{border:0;background:transparent;font-size:24px;height:42px;padding:0}

/* settings sheet */
.shade{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.45);animation:fadeIn .2s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:88%;overflow-y:auto;border-radius:30px 30px 0 0;background:#1A1218;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .35s var(--ease) both;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{font-size:22px;font-weight:800}
.sheet h3{margin:4px 0 0;font-size:12px;font-weight:700;color:var(--warm);text-transform:uppercase;letter-spacing:.6px}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wall{border:0;background:transparent;padding:0;color:#fff;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:6px;align-items:center}
.wall .pv{width:100%;height:84px;border-radius:20px;transition:box-shadow .2s,transform .2s var(--ease)}
.wall.on .pv{box-shadow:0 0 0 3px #1A1218,0 0 0 6px var(--cream);transform:scale(.96)}
.bubs{display:flex;gap:14px}
.sw{width:48px;height:48px;border-radius:50%;border:0;padding:0}
.sw.on{box-shadow:0 0 0 3px #1A1218,0 0 0 6px var(--cream)}
.row{display:flex;gap:10px}
.btn2{flex:1;height:48px;border:0;border-radius:24px;background:#2A2027;color:#fff;font-weight:700;font-size:14px}
.btn2.danger{color:#FFB3C1}
.code{font-size:13px;color:#D9C3B8;word-break:break-all}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:9;background:#1A1218;color:#fff;padding:10px 18px;border-radius:20px;font-weight:600;font-size:13px;animation:rise .3s var(--ease) both;max-width:90%;text-align:center}

/* v4 */
.bub{position:relative}.bub.hr{margin-bottom:12px}.bub.media{padding:4px}.bub.del{font-style:italic;opacity:.6}
.pic{display:block;width:230px;max-width:62vw;max-height:320px;object-fit:cover;border-radius:18px}
.rep{border-left:3px solid var(--orange);background:rgba(0,0,0,.12);border-radius:8px;padding:4px 8px;margin-bottom:6px;font-size:12px;opacity:.9;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m.in .rep{background:rgba(255,255,255,.1)}.rep b{display:block}
.rx{position:absolute;right:10px;bottom:-13px;background:#1A1218;color:#fff;border-radius:12px;padding:1px 7px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:msgpop .3s var(--ease)}
.pl{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--cream);margin-right:8px;padding:0;vertical-align:middle}
.m.in .pl{background:var(--sun);color:var(--ink)}.dur{font-weight:700;font-size:13px;vertical-align:middle}
.m.pop{animation:msgpop .3s var(--ease)}
.rpb{display:flex;align-items:center;margin:0 4px 6px;padding:6px 6px 6px 14px;border-radius:20px;background:rgba(26,18,24,.92);border-left:4px solid var(--orange);animation:rise .25s var(--ease)}
.rpt{flex:1;min-width:0;font-size:13px;display:flex;flex-direction:column}.rpt b{color:var(--warm);font-size:12px}.rpt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}

/* ===== v23: koyu sıcak tasarım ===== */

/* üst çubuk */

async function startRec(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:true}}),
      mt=['audio/webm;codecs=opus','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t)),
      mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:48000}:{audioBitsPerSecond:48000}),ch=[];
    const ac=new(window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser(),buf=new Uint8Array(an.fftSize),lv=[];ac.createMediaStreamSource(st).connect(an);
    rec={mr,ch,t0:Date.now(),cancel:false,tick:setInterval(()=>{const s=Math.floor((Date.now()-rec.t0)/1000);$('#rt').textContent=fmtD(s);an.getByteTimeDomainData(buf);lv.push(Math.max(...buf.map(v=>Math.abs(v-128))));{const w=$('#rw');if(w)w.innerHTML=lv.slice(-28).map(v=>`<i style="height:${Math.min(26,6+v/3)}px"></i>`).join('')}if(s>=60)stopRec(false)},250)};
    mr.ondataavailable=e=>ch.push(e.data);
    mr.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop());ac.close();const r=rec;clearInterval(r.tick);rec=null;
      $('#form').classList.remove('recording');$('#mc').innerHTML=ic('mic');
      if(r.cancel||Date.now()-r.t0<700)return;
      const url=await toURL(new Blob(ch,{type:mr.mimeType}));
      if(url.length>900000)return toast('Ses kaydı çok uzun, daha kısa dene.');
      send({aud:url,dur:Math.round((Date.now()-r.t0)/1000),wf:Array.from({length:32},(_,i)=>Math.min(9,Math.round((lv[Math.floor(i*lv.length/32)]||0)/10))).join('')});
    };
    mr.start();$('#form').classList.add('recording');$('#mc').innerHTML=ic('send');
  }catch(e){toast('Mikrofon izni verilmedi')}
}

function pinPad(mode,done){
  if(document.querySelector('.lock'))return;
  const el=document.createElement('div');el.className='lock';let v='',first='',stage=mode==='set'?'new':'check',busy=false;
  const T={new:'Yeni PIN gir',again:'PIN’i tekrar gir',check:'Kilidi açmak için PIN gir'};
  const draw=()=>{const nn=(P.name||'T').charAt(0).toUpperCase(),on=((P.rc||{})[P.code]||{}).n||'G';el.innerHTML=`<div class="lk"><div class="ld"><span>${esc(nn)}</span><span>${esc(on.charAt(0).toUpperCase())}</span></div><h2>aurora</h2><p>${T[stage]}</p><div class="dots" id="dts">${[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}"></i>`).join('')}</div><div class="keys">${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['',''],['0',''],['⌫','']].map(([k,l])=>k===''?'<span></span>':k==='⌫'?`<button type="button" class="bk" data-k="⌫">${ic('back',30)}</button>`:`<button type="button" data-k="${k}">${k}${l?`<small>${l}</small>`:''}</button>`).join('')}</div>${mode==='check'?'<button type="button" class="lkf" id="lf">PIN’i unuttum</button>':'<button type="button" class="lkf" id="lc">Vazgeç</button>'}</div>`};
  const shake=()=>{const d=el.querySelector('#dts');d.classList.add('shk');setTimeout(()=>{v='';draw()},350)};
  const finish=async()=>{
    busy=true;const h=await sha(v);
    if(stage==='check'){
      if(h===localStorage.getItem('aurora.pin')){el.remove();done&&done(true)}else{shake()}
    }else if(stage==='new'){first=v;v='';stage='again';draw()}
    else{if(v===first){try{localStorage.setItem('aurora.pin',h)}catch(e){}el.remove();done&&done(true)}else{toast('PIN’ler eşleşmedi');v='';first='';stage='new';draw()}}
    busy=false;
  };
  draw();document.body.appendChild(el);
  el.onclick=async e=>{
    if(e.target.closest('#lc')){el.remove();return}
    if(e.target.closest('#lf')){if(!(await ask('PIN kaldırılıp çıkış yapılsın mı?',{text:'E-posta ve şifreyle tekrar girersin.',ok:'Çıkış yap',danger:1,top:1})))return;try{localStorage.removeItem('aurora.pin')}catch(x){}el.remove();unsubRoom&&unsubRoom();unsubMsgs&&unsubMsgs();signOut(auth).catch(()=>{});return}
    const b=e.target.closest('[data-k]');if(!b||busy)return;
    const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;
    draw();if(v.length===4)finish();
  };
}

    let dist='';try{const L=room.loc||{},A=L[uid],B=L[o];if(A&&B)dist='Aranızda '+km(A.la||A.lat,A.lo||A.lng||A.lon,B.la||B.lat,B.lo||B.lng||B.lon)+' km'}catch(e){}
    const tile=(a,ic,t,sub)=>`<button type="button" class="p-cd tl7" data-a="${a}"><span class="ic7">${ic}</span><span><b>${t}</b><span>${sub}</span></span></button>`;
    el.querySelector('.pgs').innerHTML=`<div class="p-top"><h1 style="font-size:30px;letter-spacing:-.7px;line-height:1.1">Biz</h1></div>
    <div class="p-cd" style="padding:20px"><div style="display:flex;align-items:center;justify-content:space-between"><span style="display:flex"><span class="p-av" style="width:40px;height:40px;background:#F26A44;color:#fff;border:3px solid #fff;font-size:16px;box-sizing:content-box;margin:-3px">${avh(uid,P.name)}</span><span class="p-av" style="width:40px;height:40px;margin-left:-13px;background:#F2C14E;color:#15201A;border:3px solid #fff;font-size:16px;box-sizing:content-box">${avh(o,nmOf(o))}</span></span><span style="font-size:12px;font-weight:600;color:#66756B">${span}</span></div><div style="display:flex;align-items:baseline;gap:8px;margin-top:14px"><b style="font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1">${days}</b><span style="font-size:16px;font-weight:600;color:#33433A">gündür birlikte</span></div></div>
    ${yt?`<div style="padding:14px 16px;border-radius:16px;background:#E7EEE3;flex:none"><div class="p-lb" style="margin:0">Bir yıl önce bugün</div><div style="font-size:15px;font-weight:500;line-height:1.4;margin-top:4px">${esc(yt.length>110?yt.slice(0,110)+'…':yt)}</div></div>`:''}
    <div style="display:flex;align-items:center;margin-bottom:-6px;flex:none"><span class="p-lb" style="flex:1;margin:0">Yaklaşanlar</span><button type="button" id="bad" style="border:0;background:transparent;color:#C2502E;font-size:14px;font-weight:700;padding:0">Ekle</button></div>
    ${ev.length?`<div class="p-cd">${ev.map((e,k)=>{const n=daysTo(e.d);return `<button type="button" class="ev7" data-e="${k}"><span class="dt7"><b>${e.d.getDate()}</b><span>${e.d.toLocaleDateString('tr-TR',{month:'short'}).replace('.','').toLocaleUpperCase('tr')}</span></span><span style="flex:1;display:flex;flex-direction:column;text-align:left;min-width:0"><b style="font-size:15px;font-weight:700">${esc(e.t)}</b><span style="font-size:12px;color:#66756B">${n===0?'Bugün':n===1?'Yarın':n+' gün kaldı'}${e.tm?' · '+esc(e.tm):''}</span></span>${i7('chev',18)}</button>`}).join('')}</div>`:'<div class="p-note" style="margin-top:-6px">Yaklaşan bir şey yok. “Ekle” ile plan ya da özel gün ekle.</div>'}
    <div class="p-lb" style="margin-bottom:-6px">Birlikte</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none">${tile('jr',i7('book',20),'Günlük','Birlikte yazın')}${tile('nt',i7('pn',20),'Notlar',nts+' not · '+ld+'/'+lt+' madde')}${tile('mu',i7('spk',20),'Çalma listesi',mu+' şarkı')}${tile('lc',i7('pin',20),'Konum',dist||'Mesafe ve paylaşım')}</div>`;
    el.querySelectorAll('.tabs').forEach(n=>n.remove());el.querySelector('.pgs').insertAdjacentHTML('afterend',TABS('b'));bindTabs(el,'b',close);
  };
  window.__br=draw;
  el.onclick=e=>{
    if(e.target.closest('#bad')){planSheet();return}
    const ve=e.target.closest('[data-e]');if(ve){const x=bizEvents().slice(0,6)[+ve.dataset.e];if(x&&x.raw)planSheet(x.raw);else toast('Doğum günü profilden gelir');return}
    const a=e.target.closest('[data-a]');if(!a)return;({jr:openJournal,nt:openNotes,mu:openMusic,lc:openLoc})[a.dataset.a]()};
  draw();
}
function subPg(title,cls,body){
  const {el,close}=pg(`<div class="ttop"><button class="cb" id="sbk" aria-label="Geri">${ic('back',22)}</button><h1>${title}</h1><span style="flex:1"></span><span id="sact"></span></div><div id="sbd">${body||''}</div>`,'sub '+(cls||''));
  $('#sbk',el).onclick=close;return {el,close};
}
/* notlar ve listeler */
const NCOL=['#FBEAB8','#FADCD2','#E4DCF6','#D5EEDD','#D9E6FA'];
function noteSheet(n){
  const e=n||{};let col=e.c||0;
  sheetB(`<h2>${n?'Notu düzenle':'Yeni not'}</h2><textarea class="in" id="nx" rows="4" maxlength="300" placeholder="Bir şey yaz…" style="height:120px;padding:14px 18px;border-radius:22px;resize:none">${esc(e.t||'')}</textarea><div class="cols" id="nc">${NCOL.map((c,i)=>`<button type="button" data-c="${i}" style="background:${c}" class="${i===col?'on':''}" aria-label="Renk ${i+1}"></button>`).join('')}</div><div class="row"><button type="button" class="btn2" data-cl>Vazgeç</button>${n?'<button type="button" class="btn2 dgr" id="ndel">Sil</button>':''}<button type="button" class="cta" id="nsv">Kaydet</button></div>`,(ev,cl)=>{
    const c=ev.target.closest('[data-c]');if(c){col=+c.dataset.c;document.querySelectorAll('#nc button').forEach(b=>b.classList.toggle('on',+b.dataset.c===col));return}
    if(ev.target.closest('#ndel')){deleteDoc(doc(roomRef,'games',n.id)).catch(()=>toast('Silinemedi'));cl();return}
    if(ev.target.closest('#nsv')){const t=$('#nx').value.trim();if(!t){toast('Bir şey yaz');return}
      setDoc(doc(roomRef,'games',n?n.id:'nt_'+Date.now().toString(36)),{k:'nt',t,c:col,by:n?n.by:uid,ts:Date.now()}).catch(()=>toast('Kaydedilemedi'));cl()}
  });
}
function openNotes(){
  if(!roomRef||!room)return;gwatch();let tb='n';
  const {el}=subPg('Notlar ve listeler','nt');
  el.style.position='absolute';
  const draw=()=>{
    if(!document.body.contains(el)){window.__nr=null;return}
    const bd=$('#sbd',el);
    if(tb==='n'){
      const N=GD().filter(x=>x.k==='nt').sort((a,b)=>(b.ts||0)-(a.ts||0)),L=[[],[]];N.forEach((n,i)=>L[i%2].push(n));
      bd.innerHTML=`<div class="seg" style="margin:8px 18px 12px"><button type="button" data-t="n" class="on">Notlar</button><button type="button" data-t="l">Listeler</button></div>${N.length?`<div class="nts">${L.map(c=>`<div class="cl">${c.map(n=>`<button type="button" class="n" data-n="${n.id}" style="background:${NCOL[n.c||0]}"><p>${esc(n.t)}</p><span>${esc(nmOf(n.by))}</span></button>`).join('')}</div>`).join('')}</div>`:'<div class="empty" style="margin:20px 18px;padding:30px;text-align:center;color:var(--mu);font-weight:700">Henüz not yok.</div>'}<div class="addr2"><button type="button" id="nad" style="margin-left:auto" aria-label="Not ekle">${ic('plus',26,2.8)}</button></div>`;
    }else{
      const it=(GM.ls_main&&GM.ls_main.it)||[],dn=it.filter(i=>i.d).length;
      bd.innerHTML=`<div class="seg" style="margin:8px 18px 12px"><button type="button" data-t="n">Notlar</button><button type="button" data-t="l" class="on">Listeler</button></div><div class="lsw"><div style="display:flex;align-items:baseline;justify-content:space-between"><b style="font-size:32px;letter-spacing:-1px">${dn}<span style="color:var(--mu);font-size:20px"> / ${it.length}</span></b><span style="font-size:13px;font-weight:700;color:var(--mu)">birlikte tamamladınız</span></div><div class="pb"><i style="width:${it.length?dn/it.length*100:0}%"></i></div></div>${it.map((x,i)=>`<div class="lsr${x.d?' d':''}" data-i="${i}"><span class="ck" data-k="${i}">${x.d?ic('check',16,3.2):''}</span><span class="tx"><b>${esc(x.t)}</b><small>${x.d?esc(nmOf(x.dby||x.by))+' işaretledi':esc(nmOf(x.by))+' ekledi'}</small></span><button type="button" class="x" data-x="${i}" aria-label="Sil">${ic('x',18)}</button></div>`).join('')}<div style="height:90px"></div><div class="addr2"><input class="in" id="lin" maxlength="80" placeholder="Yeni madde ekle…" autocomplete="off"><button type="button" id="lad" aria-label="Ekle">${ic('plus',26,2.8)}</button></div>`;
    }
  };
  window.__nr=draw;const old=window.__gr;window.__gr=()=>{old&&old();window.__nr&&window.__nr()};
  const saveL=it=>setDoc(doc(roomRef,'games','ls_main'),{k:'ls',it,ts:Date.now()}).catch(()=>toast('Kaydedilemedi'));
  el.onclick=e=>{
    const t=e.target.closest('[data-t]');if(t){tb=t.dataset.t;draw();return}
    if(e.target.closest('#nad')){noteSheet();return}
    const n=e.target.closest('[data-n]');if(n){noteSheet(GM[n.dataset.n]);return}
    const it=((GM.ls_main&&GM.ls_main.it)||[]).map(x=>Object.assign({},x));
    if(e.target.closest('#lad')){const v=$('#lin',el).value.trim();if(!v)return;it.push({t:v,by:uid,d:0});saveL(it);return}
    const k=e.target.closest('[data-k]');if(k){const x=it[+k.dataset.k];x.d=x.d?0:1;x.dby=uid;saveL(it);return}
    const x=e.target.closest('[data-x]');if(x){it.splice(+x.dataset.x,1);saveL(it)}
  };
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lin'){e.preventDefault();$('#lad',el).click()}});
  draw();
}
/* çalma listesi */
function songSheet(){
  sheetB(`<h2>Şarkı ekle</h2><input class="in" id="sn" maxlength="60" placeholder="Şarkı adı" autocomplete="off"><input class="in" id="sa" maxlength="60" placeholder="Sanatçı (isteğe bağlı)" autocomplete="off"><input class="in" id="su" maxlength="300" placeholder="Bağlantı: Spotify, YouTube… (isteğe bağlı)" autocomplete="off" inputmode="url"><div class="row"><button type="button" class="btn2" data-cl>Vazgeç</button><button type="button" class="cta" id="ssv">Ekle</button></div>`,(ev,cl)=>{
    if(!ev.target.closest('#ssv'))return;const t=$('#sn').value.trim();if(!t){toast('Şarkı adını yaz');return}
    let u=$('#su').value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;
    setDoc(doc(roomRef,'games','mu_'+Date.now().toString(36)),{k:'mu',t,a:$('#sa').value.trim(),u,by:uid,ts:Date.now(),f:{}}).catch(()=>toast('Kaydedilemedi'));cl()});
}
const HUE=['#4A7BD8,#8E6BE0','#FFC95C,#FF7A59','#3FA66B,#2FA38F','#E8507A,#8E6BE0','#FF9468,#E8507A'];
function openMusic(){
  if(!roomRef||!room)return;gwatch();
  const {el}=subPg('Çalma listesi','mu');el.style.position='absolute';
  const draw=()=>{
    if(!document.body.contains(el)){window.__mr=null;return}
    const S=GD().filter(x=>x.k==='mu').sort((a,b)=>(b.ts||0)-(a.ts||0)),o=otherUid(),our=S.find(x=>x.f&&x.f[uid]&&x.f[o]);
    $('#sbd',el).innerHTML=`${our?`<div class="ourm"><span class="cv">${ic('speaker',38,1.8)}</span><span><small>BİZİM ŞARKIMIZ</small><b>${esc(our.t)}</b><span>${esc(our.a||'')}</span></span></div>`:''}${S.length?S.map((x,i)=>`<div class="msr" data-s="${x.id}"><span class="cv" style="background:linear-gradient(150deg,${HUE[i%5]})">${ic('speaker',22)}</span><span class="tx"><b>${esc(x.t)}</b><small>${esc(x.a||nmOf(x.by)+' ekledi')}${x.u?' · bağlantı':''}</small></span><button type="button" class="hf${x.f&&x.f[uid]?' on':''}" data-f="${x.id}" aria-label="Favori">${ic('heart',20)}</button></div>`).join(''):'<div style="margin:30px 18px;text-align:center;color:var(--mu);font-weight:700">Henüz şarkı yok.</div>'}${S.length?'<div style="margin:12px 24px;font-size:12px;font-weight:700;color:var(--mu)">İkiniz de kalbe basarsanız o şarkı “bizim şarkımız” olur.</div>':''}<div style="height:90px"></div><div class="addr2"><button type="button" id="sad" style="margin-left:auto" aria-label="Şarkı ekle">${ic('plus',26,2.8)}</button></div>`;
  };
  window.__mr=draw;const old=window.__gr;window.__gr=()=>{old&&old();window.__mr&&window.__mr()};
  el.onclick=e=>{
    if(e.target.closest('#sad')){songSheet();return}
    const f=e.target.closest('[data-f]');if(f){const x=GM[f.dataset.f],on=!(x.f&&x.f[uid]);updateDoc(doc(roomRef,'games',x.id),{['f.'+uid]:on?1:deleteField()}).catch(()=>toast('Kaydedilemedi'));return}
    const s=e.target.closest('[data-s]');if(s){const x=GM[s.dataset.s];if(x&&x.u)window.open(x.u,'_blank');else toast('Bu şarkıya bağlantı eklenmemiş')}
  };
  draw();
}
/* konum */
const km=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return Math.round(12742*Math.asin(Math.sqrt(x)))};
function openLoc(){
  if(!roomRef||!room)return;
  const {el}=subPg('Konum','lc');
  const draw=()=>{
    if(!document.body.contains(el)){window.__lr=null;return}
    const o=otherUid(),L=room.loc||{},a=L[uid],b=L[o],both=a&&b,dist=both?km(a.la,a.lo,b.la,b.lo):null;
    const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'az önce':m<60?m+' dk önce':Math.round(m/60)+' sa önce'};
    $('#sbd',el).innerHTML=`<div class="lcm"><svg viewBox="0 0 354 260" preserveAspectRatio="none" aria-hidden="true"><g stroke="#D3DDCE" stroke-width="1.5" fill="none"><path d="M0 60H354M0 130H354M0 200H354M60 0V260M150 0V260M240 0V260M320 0V260"/></g><g stroke="#F6F9F3" stroke-width="10" fill="none" stroke-linecap="round"><path d="M-10 100Q120 80 180 140T370 190"/><path d="M110 -10Q130 100 100 280"/></g><path d="M90 96Q180 30 262 168" fill="none" stroke="#15201A" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/></svg><span class="pin" style="left:66px;top:72px;background:#FF7A59;color:#fff">${avh(uid,P.name)}</span><span class="pin" style="left:240px;top:148px;background:#FFC95C;color:#2A1B14">${avh(o,nmOf(o))}</span>${both?`<span class="km">${dist} km</span>`:''}</div>
    <div class="lct"><b>${both?'Aranızda '+dist+' km var':a?nmOf(o)+' henüz paylaşmadı':'Konumunu paylaşmadın'}</b><span>${a?'Senin konumun '+ago(a.ts):'Paylaşınca mesafe görünür'}${b?' · '+esc(nmOf(o))+' '+ago(b.ts):''}</span></div>
    <div style="margin:0 20px;padding:12px 14px;border-radius:14px;background:#E7EEE3;font-size:13px;font-weight:500;color:#33433A;line-height:1.45">Konum yaklaşık olarak (yaklaşık 1 km hassasiyetle) saklanır, tam adres paylaşılmaz. İstediğin an durdurabilirsin.</div>
    <div class="lcb">${a?'<button type="button" id="lst">Paylaşımı durdur</button>':''}<button type="button" class="cr" id="lsh">${a?'Güncelle':'Konumumu paylaş'}</button></div>`;
  };
  window.__lr=draw;const oldr=window.__br;window.__br=()=>{oldr&&oldr();window.__lr&&window.__lr()};
  el.onclick=e=>{
    if(e.target.closest('#lst')){updateDoc(roomRef,{['loc.'+uid]:deleteField()}).then(()=>toast('Paylaşım durduruldu')).catch(()=>toast('Kaydedilemedi'));return}
    if(e.target.closest('#lsh')){
      if(!navigator.geolocation){toast('Konum alınamadı');return}toast('Konum alınıyor…');
      navigator.geolocation.getCurrentPosition(p=>{const r=v=>Math.round(v*100)/100;updateDoc(roomRef,{['loc.'+uid]:{la:r(p.coords.latitude),lo:r(p.coords.longitude),ts:Date.now()}}).then(()=>toast('Konum paylaşıldı')).catch(()=>toast('Kaydedilemedi'))},()=>toast('Konum izni verilmedi'),{enableHighAccuracy:false,timeout:12000,maximumAge:60000})}
  };
  draw();
}
function openMedia(){
  if(!room)return;let tab='img';
  const {el,close}=pg('','gp');
  const draw=()=>{
    const L=live().filter(m=>!m.del),it={img:L.filter(m=>m.img&&!m.once),vid:L.filter(m=>m.vid),aud:L.filter(m=>m.aud),lnk:L.filter(m=>m.text&&/https?:\/\/\S+/.test(m.text))},cur=it[tab].slice().reverse();
    const NM={img:'fotoğraf',vid:'video',aud:'ses',lnk:'bağlantı'};
    const grp={};cur.forEach(m=>{const d=mdate(m),k=MON[d.getMonth()].toLocaleUpperCase('tr')+' '+d.getFullYear();(grp[k]=grp[k]||[]).push(m)});
    const body=Object.keys(grp).map(k=>`<div class="mgh"><span>${k}</span><span>${grp[k].length} ${NM[tab]}</span></div>${tab==='img'||tab==='vid'?`<div class="mgr">${grp[k].map(m=>tab==='img'?`<button data-i="${m.id}"><img src="${bsrc(m.id,m.img)}" alt="" loading="lazy"></button>`:`<button data-v="${m.id}"><img src="${m.vp||''}" alt="">${'<span class="vd">'+ic('play',10)+fmtD(m.vdur)+'</span>'}</button>`).join('')}</div>`:`<div class="mls">${grp[k].map(m=>{const u=tab==='lnk'?(m.text.match(/https?:\/\/\S+/)||[''])[0]:'';return tab==='aud'?`<button data-a="${m.id}"><i>${ic('play',16)}</i><span>Sesli mesaj</span><small>${fmtD(m.dur)} · ${fmtT(mdate(m))}</small></button>`:`<a href="${esc(u)}" target="_blank" rel="noopener"><i>${ic('note',18)}</i><span>${esc(u.replace(/^https?:\/\//,''))}</span><small>${fmtT(mdate(m))}</small></a>`}).join('')}</div>`}`).join('');
    el.querySelector('.pgs').innerHTML=`<div class="ttop"><button class="cb" id="mb" aria-label="Geri">${ic('back',22)}</button><h1>Medya</h1></div><div class="mtabs">${[['img','Fotoğraf'],['vid','Video'],['aud','Ses'],['lnk','Bağlantı']].map(([k,t])=>`<button data-t="${k}" class="${tab===k?'on':''}">${t}</button>`).join('')}</div><div class="gb" style="padding-top:4px">${body||'<div class="mem">Henüz bir şey yok.</div>'}</div>`;
    $('#mb',el).onclick=close;
    el.querySelector('.mtabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;draw()}};
    el.querySelector('.gb').onclick=e=>{const i=e.target.closest('[data-i]'),v=e.target.closest('[data-v]'),a=e.target.closest('[data-a]');
      if(i)viewer(i.dataset.i);else if(v)playVid(v.dataset.v,v);else if(a)playAud(a.dataset.a,a)};
  };
  draw();
}
</script>
