<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Aurora</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
<meta name="theme-color" id="tc" content="#FAFAF7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--sun:#FFD27A;--amber:#FFB65C;--orange:#FF8A3D;--rose:#F2557A;--ink:#2B1208;--cream:#FFF1E2;--warm:#FFC98F;
--pill:rgba(26,18,24,.86);--inbg:rgba(26,18,24,.86);--stamp:#3A1608;--ease:cubic-bezier(.2,.8,.2,1);
--font:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#120C10;color:#fff;font:15px var(--font)}
button,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s var(--ease)}
button:active{transform:scale(.95)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,p{margin:0}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);
background:var(--wall,linear-gradient(180deg,#FFB65C 0%,#FF8A3D 48%,#F2557A 100%))}
.scr.sun{--wall:radial-gradient(110% 55% at 95% 8%,#FF4F7B 0%,rgba(255,79,123,0) 62%),radial-gradient(90% 45% at 0% 38%,#FFD27A 0%,rgba(255,210,122,0) 62%),radial-gradient(100% 55% at 85% 92%,#FF5A36 0%,rgba(255,90,54,0) 66%),linear-gradient(180deg,#FFB65C 0%,#FF8A3D 48%,#F2557A 100%)}
.scr::before,.scr::after{content:"";position:absolute;border-radius:50%;pointer-events:none;animation:drift 9s ease-in-out infinite alternate}
.scr::before{left:-60px;top:30%;width:240px;height:240px;background:#FFE3A8;opacity:.5;filter:blur(46px)}
.scr::after{right:-70px;top:58%;width:260px;height:260px;background:#FF3D6E;opacity:.4;filter:blur(52px);animation-delay:-4s}
.scr.night{background:#120C10;--pill:#241A21;--inbg:#2A2027;--stamp:#BFA89C}
.scr.night::before{background:#FF8A3D;opacity:.25;filter:blur(80px);left:auto;right:-90px;top:-40px}
.scr.night::after{background:#F2557A;opacity:.22;filter:blur(90px);left:-100px;right:auto;top:55%}
@keyframes drift{to{transform:translate(26px,-30px)}}
.scr>*{position:relative;z-index:1}
.fade{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:scale(.985)}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.stag>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 80ms)}
.hidden{display:none!important}

/* splash + join */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.logo{width:92px;height:92px;border-radius:30px;background:var(--pill);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--sun);box-shadow:0 14px 34px rgba(90,20,10,.32)}
.big{font-size:38px;font-weight:800;letter-spacing:-.8px;color:var(--ink)}
.sub{color:#3A1608;font-weight:600;opacity:.85}
.card{width:100%;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:28px;background:rgba(26,18,24,.88);text-align:left}
.card label{font-size:12px;font-weight:700;color:var(--warm)}
.in{height:50px;border:0;border-radius:25px;padding:0 18px;background:rgba(0,0,0,.4);color:#fff;font-size:16px;width:100%}
.in::placeholder{color:#D9C3B8}
.in:focus{outline:2px solid var(--amber)}
.cta{height:52px;border:0;border-radius:26px;background:linear-gradient(135deg,var(--sun),#FF6A3D);color:var(--ink);font-size:16px;font-weight:800}
.err{color:#FFB3C1;font-size:13px;font-weight:600;min-height:18px}

/* chat */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.who{flex:1;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 6px;border:0;border-radius:26px;background:var(--pill);color:#fff;text-align:left;min-width:0;box-shadow:0 10px 28px rgba(90,20,10,.28)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--sun),#FF6A3D);color:var(--ink);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:12px;color:var(--warm);font-weight:600;min-height:15px}
.rb{width:52px;height:52px;border-radius:26px;border:0;background:var(--pill);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none;box-shadow:0 10px 28px rgba(90,20,10,.28)}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:14px 16px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msgs .sp{margin-top:auto}
.day{align-self:center;font-size:12px;font-weight:700;color:#fff;background:rgba(26,18,24,.55);padding:5px 12px;border-radius:14px;flex:none}
.m{display:flex;align-items:flex-end;gap:6px;max-width:84%;flex:none}
.m.in{align-self:flex-start}
.m.out{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:11px 16px;font-size:15px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.m.in .bub{border-radius:22px 22px 22px 8px;background:var(--inbg);color:#fff}
.m.out .bub{border-radius:22px 22px 8px 22px;background:var(--outbg,var(--cream));color:var(--ink);font-weight:500;box-shadow:0 6px 16px rgba(120,30,10,.18)}
.t{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--stamp);padding-bottom:4px;flex:none}
.tick{font-size:12px;letter-spacing:-3px;margin-right:3px}
.tick.r{color:#1E7BFF}
.pop{animation:msgpop .3s var(--ease)}
@keyframes msgpop{from{transform:translateY(10px) scale(.96);opacity:0}}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:22px 22px 22px 8px;background:var(--inbg);flex:none}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--warm);animation:dot 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.composer{padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:center;gap:6px;height:60px;padding:0 7px 0 8px;border-radius:30px;background:rgba(26,18,24,.92);box-shadow:0 14px 34px rgba(90,20,10,.32)}
.field{flex:1;min-width:0;display:flex;align-items:center;height:44px;border-radius:22px;background:rgba(0,0,0,.38)}
.field:focus-within{box-shadow:0 0 0 2px var(--amber)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-size:16px;height:100%;padding:0 14px 0 0}
.field input:focus-visible{outline:none}
.ib{width:44px;height:44px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none;font-size:22px}
.send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--sun),#FF6A3D);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin:0 16px 10px;padding:8px;border-radius:22px;background:rgba(26,18,24,.92);animation:rise .25s var(--ease)}
.emojis button{border:0;background:transparent;font-size:24px;height:42px;padding:0}

/* settings sheet */
.shade{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.45);animation:fadeIn .2s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:88%;overflow-y:auto;border-radius:30px 30px 0 0;background:#1A1218;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .35s var(--ease) both;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{font-size:22px;font-weight:800}
.sheet h3{margin:4px 0 0;font-size:12px;font-weight:700;color:var(--warm);text-transform:uppercase;letter-spacing:.6px}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wall{border:0;background:transparent;padding:0;color:#fff;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:6px;align-items:center}
.wall .pv{width:100%;height:84px;border-radius:20px;transition:box-shadow .2s,transform .2s var(--ease)}
.wall.on .pv{box-shadow:0 0 0 3px #1A1218,0 0 0 6px var(--cream);transform:scale(.96)}
.bubs{display:flex;gap:14px}
.sw{width:48px;height:48px;border-radius:50%;border:0;padding:0}
.sw.on{box-shadow:0 0 0 3px #1A1218,0 0 0 6px var(--cream)}
.row{display:flex;gap:10px}
.btn2{flex:1;height:48px;border:0;border-radius:24px;background:#2A2027;color:#fff;font-weight:700;font-size:14px}
.btn2.danger{color:#FFB3C1}
.code{font-size:13px;color:#D9C3B8;word-break:break-all}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:9;background:#1A1218;color:#fff;padding:10px 18px;border-radius:20px;font-weight:600;font-size:13px;animation:rise .3s var(--ease) both;max-width:90%;text-align:center}

/* v4 */
.bub{position:relative}.bub.hr{margin-bottom:12px}.bub.media{padding:4px}.bub.del{font-style:italic;opacity:.6}
.pic{display:block;width:230px;max-width:62vw;max-height:320px;object-fit:cover;border-radius:18px}
.rep{border-left:3px solid var(--orange);background:rgba(0,0,0,.12);border-radius:8px;padding:4px 8px;margin-bottom:6px;font-size:12px;opacity:.9;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m.in .rep{background:rgba(255,255,255,.1)}.rep b{display:block}
.rx{position:absolute;right:10px;bottom:-13px;background:#1A1218;color:#fff;border-radius:12px;padding:1px 7px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3);animation:msgpop .3s var(--ease)}
.pl{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--cream);margin-right:8px;padding:0;vertical-align:middle}
.m.in .pl{background:var(--sun);color:var(--ink)}.dur{font-weight:700;font-size:13px;vertical-align:middle}
.m.pop{animation:msgpop .3s var(--ease)}
.rpb{display:flex;align-items:center;margin:0 4px 6px;padding:6px 6px 6px 14px;border-radius:20px;background:rgba(26,18,24,.92);border-left:4px solid var(--orange);animation:rise .25s var(--ease)}
.rpt{flex:1;min-width:0;font-size:13px;display:flex;flex-direction:column}.rpt b{color:var(--warm);font-size:12px}.rpt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.send{animation:msgpop .25s var(--ease)}.send.mic{background:#2A2027;color:#fff;font-size:20px}.recording #mc{background:#FF3D6E;color:#fff}
.recbox{display:none;flex:1;align-items:center;gap:10px;padding-left:14px;font-weight:700}.recording .recbox{display:flex}.recording .field{display:none}
#rt{flex:1}.rd{width:12px;height:12px;border-radius:50%;background:#FF3D6E;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.5);opacity:.4}}
.ctx{position:absolute;left:50%;top:50%;width:78%;max-width:340px;z-index:6;background:#1A1218;border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:2px;transform:translate(-50%,-50%);animation:zin .25s var(--ease) both;box-shadow:0 20px 50px rgba(0,0,0,.5)}
@keyframes zin{from{opacity:0;transform:translate(-50%,-46%) scale(.9)}}
.ctx button{border:0;background:transparent;color:#fff;text-align:left;font-size:15px;font-weight:600;height:46px;border-radius:16px;padding:0 14px}.ctx button:active{background:#2A2027}
.ctx .danger{color:#FFB3C1}
.rxr{display:flex;justify-content:space-between;padding:2px 0 8px;border-bottom:1px solid #2A2027;margin-bottom:4px}
.rxr button{width:44px;height:44px;padding:0;font-size:26px;text-align:center;border-radius:50%;animation:rise .35s var(--ease) both;animation-delay:calc(var(--i)*40ms)}.rxr button.on{background:#2A2027;box-shadow:0 0 0 2px var(--amber)}
.sheet>*{animation:rise .4s var(--ease) both}
.zm{display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,.88)}.zm img{max-width:96%;max-height:90%;border-radius:12px;animation:zin .25s var(--ease)}

/* v5 */
.lt{--pill:#FFF8F0;--inbg:#FFF8F0;--stamp:#3A1608}
.lt .who,.lt .rb,.lt .hc,.lt .nav button,.lt .m.in .bub,.lt .field input,.lt .ib{color:var(--ink)}
.lt .bar,.lt .rpb{background:rgba(255,248,240,.95)}.lt .field{background:rgba(0,0,0,.07)}.lt .hm small,.lt .who small,.lt .hx{color:#8A4A22}.lt .nav button.on{background:rgba(255,138,61,.28)}
.hh{display:flex;align-items:center;padding:22px 20px 0}.ht{flex:1;font-size:34px;font-weight:800;color:var(--ink)}
.hbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}.go>*{animation:rise .45s var(--ease) both}.go>*:nth-child(2){animation-delay:.07s}
.hc{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:0;border-radius:30px;background:var(--pill);color:#fff;text-align:left;flex:none}
.hc .av{width:56px;height:56px;font-size:22px}.hm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.hm b{font-size:17px}
.hm small{color:#D9C3B8;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;color:var(--warm);font-weight:700}
.bd{background:var(--amber);color:var(--ink);border-radius:12px;min-width:22px;height:22px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-style:normal}.bd:empty{display:none}
.nav{display:flex;margin:0 20px calc(16px + env(safe-area-inset-bottom,0px));padding:8px;border-radius:34px;background:var(--pill)}
.nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:#fff;font-size:12px;font-weight:700;padding:8px 0;border-radius:26px}
.nav button.on{background:rgba(255,255,255,.14)}.nav .bd{position:absolute;top:0;right:calc(50% - 34px)}
.fab{position:absolute;right:22px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--sun),#FF6A3D);font-size:26px;box-shadow:0 14px 30px rgba(90,20,10,.35);animation:msgpop .5s var(--ease) .3s both}
.pinb{display:flex;gap:8px;align-items:center;margin:10px 16px 0;padding:8px 14px;border-radius:18px;background:var(--pill);font-size:13px;animation:rise .3s var(--ease)}.pinb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lt .pinb{color:var(--ink)}
.dn{position:absolute;right:20px;bottom:96px;width:44px;height:44px;border-radius:50%;border:0;background:var(--pill);color:#fff;font-size:20px;box-shadow:0 8px 20px rgba(0,0,0,.3);animation:msgpop .25s var(--ease)}
.dn[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-6px;right:-4px;background:var(--amber);color:var(--ink);border-radius:10px;font-size:11px;font-weight:800;padding:1px 6px}
.lt .dn{color:var(--ink)}
.flash .bub{animation:fl 1.2s}@keyframes fl{50%{box-shadow:0 0 0 4px var(--sun)}}
.bub.st{background:transparent!important;box-shadow:none!important;font-size:64px;line-height:1.1;padding:0}
.et{grid-column:1/-1;display:flex;gap:8px;margin-bottom:6px}.et button{flex:1;height:34px;font-size:13px;font-weight:700;color:#fff;border-radius:17px;background:#2A2027}.et .on{background:var(--sun);color:var(--ink)}
.wf{display:inline-flex;align-items:center;gap:2px;height:26px;margin-right:8px;vertical-align:middle}.wf i{width:3px;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .2s}.wf i.on{opacity:1}
.bub a{color:inherit;text-decoration:underline}.btn2.on2{background:var(--sun);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v6 cila */
html,body{overscroll-behavior:none}
button{-webkit-user-select:none;user-select:none}
.rb svg,.ib svg,.send svg,.dn svg,.fab svg{display:block}
.bub{font-size:var(--fs,15px)}
.bub.st{font-size:64px}
.tick{display:inline-flex;align-items:center;letter-spacing:0;margin-right:2px}
.pl{display:inline-flex;align-items:center;justify-content:center}
.pl svg{margin:0!important}
.bub svg{vertical-align:-3px;margin-right:2px}
.ctx button{display:flex;align-items:center;gap:12px}
.ctx button svg{flex:none;opacity:.9}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.fab{color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.dn{display:flex;align-items:center;justify-content:center;padding:0}
.rb:active,.ib:active{background:rgba(255,255,255,.12)}
.send.mic{color:#fff}
.rpb .ib{color:#fff}.lt .rpb .ib{color:var(--ink)}
/* v7 */
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{width:104px;height:104px;font-size:42px;border:0;padding:0}
.slide{animation:slideIn .32s var(--ease) both}.slideb{animation:slideBack .32s var(--ease) both}
@keyframes slideIn{from{transform:translateX(28px);opacity:0}}
@keyframes slideBack{from{transform:translateX(-28px);opacity:0}}
.spin{display:inline-block;width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.spin.dk{border-color:rgba(43,18,8,.2);border-top-color:var(--ink);margin-top:8px}
.spin.sm{width:20px;height:20px;border-width:2.5px;border-color:rgba(43,18,8,.25);border-top-color:var(--ink);vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:sp 1.6s linear infinite!important}}
.empty{align-self:center;margin-bottom:auto;max-width:82%;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 24px;border-radius:26px;background:var(--pill);color:#fff;animation:rise .45s var(--ease) both}
.lt .empty{color:var(--ink)}.empty b{font-size:16px}.empty p{font-size:14px;opacity:.85}
.cdb{background:rgba(0,0,0,.3);padding:8px 14px;border-radius:14px;font-size:15px;font-weight:700;color:#fff;word-break:break-all;user-select:all}
.m.pend .bub{opacity:.72}
.t.fail{color:#FFB3C1;gap:8px;font-weight:700}.lt .t.fail{color:#B3263F}
.t.fail button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:4px 10px;font-size:11px;font-weight:700}.lt .t.fail button{background:rgba(0,0,0,.08);color:var(--ink)}
.pvw{display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,.9)}
.pvb{width:92%;max-height:92%;display:flex;flex-direction:column;gap:12px}
.pvg{display:grid;gap:8px;grid-template-columns:1fr 1fr;overflow:auto;max-height:58vh}.pvg.n1{grid-template-columns:1fr}
.pvi{position:relative}.pvi img{width:100%;max-height:52vh;object-fit:cover;border-radius:16px;display:block}
.pvi button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;padding:0;display:flex;align-items:center;justify-content:center}
/* v8 */
.m.g{margin-top:-5px}
.msgs{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pic{background:rgba(0,0,0,.15);min-height:120px}
#chat::before,#chat::after{animation:none}
.more{align-self:center;flex:none;border:0;border-radius:16px;padding:8px 16px;background:var(--pill);color:#fff;font-size:13px;font-weight:700}
.lt .more{color:var(--ink)}
/* v9: gereksiz animasyonlar kapalı */
.stag>*,.go>*,.sheet>*,.rxr button,.fab,.empty,.send{animation:none!important}
.scr::before,.scr::after{animation:none!important}
/* v10: hız */

function errText(e){
  const c=(e&&e.code)||'';
  if(c==='full')return 'Bu oda dolu. Hesabını geri almak için eski adını aynen yaz.';
  if(c.includes('network')||navigator.onLine===false)return 'İnternet bağlantını kontrol et.';
  if(c==='auth/email-already-in-use')return 'Bu e-posta zaten kayıtlı. Giriş yapmayı dene.';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c))return 'E-posta veya şifre yanlış.';
  if(c==='auth/weak-password')return 'Şifre en az 6 karakter olmalı.';
  if(c==='auth/invalid-email')return 'E-posta adresi geçersiz.';
  if(c==='auth/too-many-requests')return 'Çok fazla deneme yaptın. Biraz bekleyip tekrar dene.';
  if(c.includes('permission'))return 'Bu işlem için izin yok. Biraz sonra tekrar dene.';
  if(c.includes('api-key')||c.includes('referer')||c.includes('operation-not-allowed')||c.includes('admin-restricted'))return 'Şu an bağlanılamıyor. Biraz sonra tekrar dene.';
  return 'Bir sorun oluştu. Tekrar dene.';
}

async function enterRoom(name,code,toChat){
  if(!uid&&auth.currentUser)uid=auth.currentUser.uid;
  const ref=doc(db,'rooms',code);
  const snap=await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{members:[uid],names:{[uid]:name},createdAt:serverTimestamp()});
  }else{
    const d=snap.data();
    if(!d.members.includes(uid)){
      if(d.members.length>=2){
        const old=d.members.find(x=>((d.names||{})[x]||'').toLowerCase()===name.toLowerCase());
        if(!old){const e=new Error('full');e.code='full';throw e}
        await updateDoc(ref,{members:d.members.map(x=>x===old?uid:x),['names.'+uid]:name,['alias.'+uid]:(d.alias||{})[old]||old});
      }else await updateDoc(ref,{members:arrayUnion(uid),['names.'+uid]:name});
    }else if((d.names||{})[uid]!==name){await updateDoc(ref,{['names.'+uid]:name})}
  }
  P.name=name;P.code=code;save();setDoc(doc(db,'users',uid),{name,code}).catch(()=>{});
  openChat(code,toChat);
}

function pinPad(mode,done){
  if(document.querySelector('.lock'))return;
  const el=document.createElement('div');el.className='lock';let v='',first='',stage=mode==='set'?'new':'check',busy=false;
  const T={new:'Yeni PIN gir',again:'PIN’i tekrar gir',check:'PIN’i gir'};
  const draw=()=>{el.innerHTML=`<div class="lk"><div class="lkl">${ic('lock',34,1.8)}</div><h2>${T[stage]}</h2><div class="dots" id="dts">${[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}"></i>`).join('')}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>${mode==='check'?'<button type="button" class="lkf" id="lf">PIN’i unuttum</button>':'<button type="button" class="lkf" id="lc">Vazgeç</button>'}</div>`};
  const shake=()=>{const d=el.querySelector('#dts');d.classList.add('shk');setTimeout(()=>{v='';draw()},350)};
  const finish=async()=>{
    busy=true;const h=await sha(v);
    if(stage==='check'){
      if(h===localStorage.getItem('aurora.pin')){el.remove();done&&done(true)}else{shake()}
    }else if(stage==='new'){first=v;v='';stage='again';draw()}
    else{if(v===first){try{localStorage.setItem('aurora.pin',h)}catch(e){}el.remove();done&&done(true)}else{toast('PIN’ler eşleşmedi');v='';first='';stage='new';draw()}}
    busy=false;
  };
  draw();document.body.appendChild(el);
  el.onclick=async e=>{
    if(e.target.closest('#lc')){el.remove();return}
    if(e.target.closest('#lf')){if(!(await ask('PIN kaldırılıp çıkış yapılsın mı?',{text:'E-posta ve şifreyle tekrar girersin.',ok:'Çıkış yap',danger:1,top:1})))return;try{localStorage.removeItem('aurora.pin')}catch(x){}el.remove();unsubRoom&&unsubRoom();unsubMsgs&&unsubMsgs();signOut(auth).catch(()=>{});return}
    const b=e.target.closest('[data-k]');if(!b||busy)return;
    const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;
    draw();if(v.length===4)finish();
  };
}

  sk.addEventListener('pointerdown',e=>{if(!ready)return;drag=true;dragT=tAt(e.clientX);try{sk.setPointerCapture(e.pointerId)}catch(_){}paint();clearTimeout(hideT)});
  sk.addEventListener('pointermove',e=>{if(!drag)return;dragT=tAt(e.clientX);paint()});
  const endSeek=()=>{if(!drag)return;drag=false;v.currentTime=dragT;paint();showCtl()};
  sk.addEventListener('pointerup',endSeek);sk.addEventListener('pointercancel',endSeek);
}

/* ---------- başlat ---------- */
if('serviceWorker'in navigator&&location.protocol.startsWith('http')&&!window.Capacitor)navigator.serviceWorker.register('sw.js').catch(()=>{});
history.replaceState({base:1},'');
let armed=false;const arm=()=>{if(armed)return;armed=true;history.pushState({s:1},'')};
['pointerup','click','touchend'].forEach(t=>addEventListener(t,arm,{capture:true,passive:true}));
addEventListener('popstate',()=>{
  if(skip>0){skip--;return}
  if(document.querySelector('.lock')){history.pushState({s:1},'');return}
  if(layers.length){layers.pop().fn();return}
  if(view==='chat'||(view==='auth'&&joinCan&&room)){showHome();return}
  const st=history.state;if(st&&st.base)atBase();
});
function exitTry(){
  if(Date.now()-exitT<2000){if(CPl&&CPl.App&&CPl.App.exitApp)CPl.App.exitApp();else if(navigator.app&&navigator.app.exitApp)navigator.app.exitApp();else history.back();return true}
  exitT=Date.now();toast('Çıkmak için tekrar geri bas');return false;
}
function atBase(){if(!exitTry())history.pushState({s:1},'')}
function hwBack(){
  if(document.querySelector('.lock'))return;
  if(layers.length){exitT=0;layers.pop().fn();return}
  if(view==='chat'||(view==='auth'&&joinCan&&room)){exitT=0;showHome();return}
  exitTry();
}
try{if(CPl&&CPl.App&&CPl.App.addListener)CPl.App.addListener('backButton',hwBack)}catch(e){}
document.addEventListener('backbutton',hwBack,false);
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
applyFs();wallStyle();if(pinOn())pinPad('check',()=>{});splash();
try{
  const fbApp=initializeApp(firebaseConfig);auth=getAuth(fbApp);try{db=initializeFirestore(fbApp,{localCache:persistentLocalCache({})})}catch(e){console.warn(e);db=getFirestore(fbApp)}
  const wait=new Promise(r=>setTimeout(r,450));
  onAuthStateChanged(auth,async u=>{
    await wait;
    if(u&&!u.isAnonymous)await afterAuth();else authScreen();
  });
}catch(e){console.error(e);joinScreen('Başlatılamadı: '+e.message)}
</script>
