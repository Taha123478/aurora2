name: APK olustur
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web dosyalarini hazirla
        run: mkdir -p www/vendor && cp index.html manifest.json icon-192.png icon-512.png icon-maskable-512.png www/
      - name: Firebase dosyalarini uygulamaya gom
        run: for f in firebase-app firebase-auth firebase-firestore; do curl -fsSL "https://www.gstatic.com/firebasejs/10.14.1/$f.js" -o "www/vendor/$f.js"; sed -i 's|https://www.gstatic.com/firebasejs/10.14.1/|./|g' "www/vendor/$f.js"; done
      - name: Firebase yollarini yerel yap
        run: sed -i 's|https://www.gstatic.com/firebasejs/10.14.1/|./vendor/|g' www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Mikrofon izni
        run: sed -i 's|</manifest>|<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/></manifest>|' android/app/src/main/AndroidManifest.xml
      - name: APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
