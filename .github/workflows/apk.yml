name: APK olustur
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web dosyalarini hazirla
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
